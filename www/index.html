<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VoiDx</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: #0b0b0f; color: #f5f5f7;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
      }
      .logo { font-size: 40px; font-weight: 800; letter-spacing: -1px; }
      .logo i { color: #8b5cf6; font-style: normal; }
      p { color: #a1a1aa; max-width: 320px; line-height: 1.5; }
      .spin { margin: 20px auto; width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid #27272a; border-top-color: #8b5cf6; animation: r 1s linear infinite; }
      @keyframes r { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div>
      <div class="logo">Vo<i>i</i>Dx</div>
      <div class="spin"></div>
      <p>
        Connexion au serveur VoiDx…<br />
        Si rien ne s'affiche, vérifie que le serveur est démarré et que
        <code>CAP_SERVER_URL</code> pointe vers la bonne adresse.
      </p>
    </div>
  </body>
</html>
